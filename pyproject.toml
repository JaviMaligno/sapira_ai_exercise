[tool.poetry]
name = "sapira-ai-exercise"
version = "0.1.0"
description = "Fraud data consolidation ETL and experimentation"
authors = ["Javier <javier@example.com>"]
readme = "README.md"
packages = [
  { include = "sapira_etl", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pandas = "^2.2.2"
fastparquet = "^2024.5.0"
numpy = "^2.0.0"
python-dateutil = "^2.9.0.post0"
tqdm = "^4.66.4"
pymongo = "^4.18.2"
SQLAlchemy = "^2.0.30"
psycopg2-binary = "^2.9.9"
PyYAML = "^6.0.1"
python-dotenv = "^1.2.2"
scikit-learn = "^1.5.2"

# Optional performance/data engines
polars = { version = "^1.4.1", optional = true }
dask = { version = "^2024.7.1", optional = true, extras = ["dataframe"] }
shap = "^0.48.0"
matplotlib = "^3.10.5"
markdown = "^3.8.2"
weasyprint = "^70.0"
mlflow = {version = "^2.22.4", extras = ["extras"]}
boto3 = "^1.35.0"

# Security floors for the existing MLflow extras dependency closure.
# AzureML currently caps PyOpenSSL at 26.0.0 and cryptography below 47;
# unresolved advisories and MLflow/PyArrow migration: docs/security-runtime-followup.md.
anyio = ">=4.14.2,<5"
azure-core = ">=1.38.0,<2"
azureml-core = ">=1.61.0.post4,<2"
brotli = ">=1.2.0,<2"
certifi = ">=2026.10.19"
cryptography = ">=46.0.7,<47"
fastapi = ">=0.136.3,<1"
starlette = ">=1.3.1,<2"
filelock = ">=3.20.3,<4"
flask = ">=3.1.3,<4"
fonttools = ">=4.60.2,<5"
fsspec = ">=2026.6.0"
gitpython = ">=3.1.62,<4"
graphql-core = ">=3.2.13,<3.3"
idna = ">=3.15,<4"
mako = ">=1.4.2,<2"
oauthlib = ">=4.0.0,<5"
opentelemetry-api = ">=1.45.1,<2"
opentelemetry-sdk = ">=1.45.1,<2"
pillow = ">=13.0.0,<14"
protobuf = ">=6.33.5,<7"
pyasn1 = ">=0.6.4,<0.7"
pygments = ">=2.20.0,<3"
pyjwt = ">=2.15.0,<3"
pynacl = ">=1.6.2,<2"
pyopenssl = ">=26.0.0,<=26.0.0"
sqlparse = ">=0.6.0,<1"
urllib3 = ">=2.8.0,<3"
virtualenv = ">=21.14.5,<22"
werkzeug = ">=3.1.9,<4"

[tool.poetry.extras]
fast = ["polars", "dask"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.4"
pytest = "^9.0.3"
requests = "^2.33.0"
docker = "^7.1.0"
psutil = "^7.0.0"
python-dotenv = "^1.2.2"

[tool.poetry.scripts]
etl-run = "sapira_etl.etl_unified:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"


